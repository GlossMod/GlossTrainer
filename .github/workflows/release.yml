name: Build, validate and release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Windows x64 ${{ matrix.mode }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check formal source version and release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceVersions = [regex]::Matches((Get-Content -LiteralPath BlackMythWukong/src/runtime.hpp -Raw), 'inline\s+constexpr\s+char\s+Version\[\]\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*;')
          if ($sourceVersions.Count -ne 1) { throw 'Expected one formal version in runtime.hpp.' }
          $tag = 'v' + $sourceVersions[0].Groups[1].Value
          if ($env:EVENT_NAME -eq 'push' -and ($env:REF_NAME -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $env:REF_NAME -cne $tag)) {
            throw "Tag '$env:REF_NAME' must exactly match source version '$tag'."
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up pinned xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: '3.1.2'

      - name: Configure and build all tracked targets
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          & xmake f -y -p windows -a x64 -m $env:BUILD_MODE
          if ($LASTEXITCODE -ne 0) { throw 'xmake configuration failed.' }
          & xmake build -y
          if ($LASTEXITCODE -ne 0) { throw 'xmake build failed.' }

      - name: Run every validation executable
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $testNames = @([regex]::Matches((Get-Content -LiteralPath BlackMythWukong/validation/xmake.lua -Raw), 'target\("([^"\r\n]+Tests)"\)') | ForEach-Object { $_.Groups[1].Value })
          if ($testNames.Count -eq 0 -or @($testNames | Sort-Object -Unique).Count -ne $testNames.Count) { throw 'Validation target inventory is empty or duplicated.' }
          $repository = $PWD.Path
          $workingDirectory = Join-Path $repository ('output/validation-' + $env:BUILD_MODE)
          New-Item -ItemType Directory -Path $workingDirectory -Force | Out-Null
          Push-Location -LiteralPath $workingDirectory
          try {
            foreach ($testName in $testNames) {
              $testPath = Join-Path (Join-Path (Join-Path $repository build) $env:BUILD_MODE) ($testName + '.exe')
              if (-not (Test-Path -LiteralPath $testPath -PathType Leaf)) { throw "Validation executable is missing: $testPath" }
              Write-Host "Running $testName ($env:BUILD_MODE) from an isolated output directory"
              & $testPath
              if ($LASTEXITCODE -ne 0) { throw "$testName failed with exit code $LASTEXITCODE." }
            }
          } finally { Pop-Location }

      - name: Validate installer behavior with isolated fixtures
        if: matrix.mode == 'release'
        run: |
          $fixtureRoot = Join-Path $PWD 'output/installer-fixtures'
          New-Item -ItemType Directory -Path $fixtureRoot -Force | Out-Null
          $env:TEMP = $fixtureRoot
          $env:TMP = $fixtureRoot
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Scripts/test-install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer regression failed.' }

      - name: Package verified Release ASI
        if: matrix.mode == 'release'
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          & ./Scripts/package-release.ps1 -Artifact ./build/release/BlackMythWukong.asi -OutputDirectory ./output/release-package-ci -Tag $env:RELEASE_TAG -SourceRevision $env:SOURCE_REVISION
          if (-not $?) { throw 'Release packaging failed.' }

      - name: Test portable packaging offline in PowerShell 5 and 7
        if: matrix.mode == 'release'
        run: |
          foreach ($engine in @('powershell.exe', 'pwsh.exe')) {
            & $engine -NoProfile -ExecutionPolicy Bypass -File ./Scripts/test-package-release.ps1 -Artifact ./build/release/BlackMythWukong.asi -LoaderArchive ./output/release-package-ci/cache/Ultimate-ASI-Loader/v10.0.0/Ultimate-ASI-Loader_x64.zip -OutputDirectory ./output/release-package-validation
            if ($LASTEXITCODE -ne 0) { throw "Release package regression failed in $engine." }
          }

      - name: Upload release candidate
        if: matrix.mode == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: |
            output/release-package-ci/GlossTrainer-BlackMythWukong-*-win64.zip
            output/release-package-ci/SHA256SUMS.txt
            output/release-package-ci/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish formal GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: output/release-candidate

      - name: Verify archive checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Only formal version tags can be published.' }
          $name = "GlossTrainer-BlackMythWukong-$env:RELEASE_TAG-win64.zip"
          $zip = Join-Path $PWD (Join-Path 'output/release-candidate' $name)
          $sums = Join-Path $PWD 'output/release-candidate/SHA256SUMS.txt'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath $sums -Raw) -cne "$actual  $name`n") { throw 'Downloaded release candidate checksum differs.' }
          $arguments = @('release', 'create', $env:RELEASE_TAG, $zip, $sums, '--repo', $env:GH_REPO, '--verify-tag', '--title', "GlossTrainer $env:RELEASE_TAG", '--generate-notes', '--latest')
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
